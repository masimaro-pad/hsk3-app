<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSK 3급 공부방</title>
<meta name="description" content="HSK 3급 단어·문법·문장 배열을 공부하고 확인하는 앱">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HSK 3급">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF2EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101513" media="(prefers-color-scheme: dark)">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}
img{max-width:100%}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one app, three sections (홈 / 단어 / 문법). Sticky header: brand + section tabs, then mode switch + scrolling rail. */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --sunk:#F5F8F6; --ink:#18211D; --muted:#5E6B65; --line:#D3DCD7;
  --accent:#17694F; --accent-ink:#FFFFFF; --accent-soft:#DCEBE4;
  --bad:#B4432B; --bad-soft:#F6E1DB; --mark:#F3E3A6;
  --font-han:"Noto Serif SC","Songti SC","STSong",serif;
  --font-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101513; --surface:#18201C; --sunk:#141B18; --ink:#E4EBE7; --muted:#93A29B; --line:#2A3530;
    --accent:#5CC49A; --accent-ink:#0E1A15; --accent-soft:#1C3229;
    --bad:#E88A72; --bad-soft:#3A231D; --mark:#4A4120; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101513; --surface:#18201C; --sunk:#141B18; --ink:#E4EBE7; --muted:#93A29B; --line:#2A3530;
  --accent:#5CC49A; --accent-ink:#0E1A15; --accent-soft:#1C3229;
  --bad:#E88A72; --bad-soft:#3A231D; --mark:#4A4120; color-scheme:dark;
}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit;touch-action:manipulation}
button:focus-visible,[role="button"]:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px}
.brand{flex:none;font-family:var(--font-han);font-size:20px;font-weight:700;letter-spacing:.02em;white-space:nowrap;border:0;background:none;padding:0;cursor:pointer}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px;padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.sm button{padding:6px 11px;font-size:13px}
.subbar{display:flex;gap:10px;align-items:center;padding-block:0 12px}
.rail{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rail::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);font-size:14px;padding:7px 12px;border-radius:10px;cursor:pointer;display:flex;gap:6px;align-items:baseline;white-space:nowrap}
.chip small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip[aria-pressed="true"] small{color:var(--accent)}

main{padding-block:16px 48px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;cursor:pointer}
.tog[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hint{color:var(--muted);font-size:13px}
.legend{display:flex;gap:12px;color:var(--muted);font-size:12px;align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
section.grp{margin-top:20px}
section.grp>h2{font-size:15px;font-weight:600;margin:0 0 10px;display:flex;gap:8px;align-items:baseline}
section.grp>h2 small{color:var(--muted);font-weight:400;font-size:13px}

/* home */
.home{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-size:16px;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.panel h2 small{font-size:13px;color:var(--muted);font-weight:400}
.weekhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.weekno{font-size:30px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.weekno small{font-size:15px;color:var(--muted);font-weight:500;margin-left:4px}
.phase{color:var(--accent);font-size:14px;font-weight:600}
.startf{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.startf input{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:6px 8px;font-size:14px;color:var(--ink)}
.weekbar{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.weekbar i{height:6px;border-radius:3px;background:var(--line)}
.weekbar i.past{background:var(--accent-soft)}
.weekbar i.now{background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:6px}
.stat .lab{font-size:13px;color:var(--muted)}
.stat .big{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .big small{font-size:14px;color:var(--muted);font-weight:500}
.meter{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.todo{display:flex;flex-direction:column}
.todo .sub{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;padding-block:8px 2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%}
.row:last-child{border-bottom:0}
.row .nm{display:flex;gap:8px;align-items:baseline;min-width:0;flex-wrap:wrap}
.row .nm .zhs{font-family:var(--font-han);font-size:17px;font-weight:700}
.row .nm span{font-size:14px}
.row .rt{display:flex;gap:8px;align-items:center;flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .rt .go{color:var(--accent);font-size:16px}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.k{background:var(--accent-soft);color:var(--accent)}
.pill.u{background:var(--bad-soft);color:var(--bad)}
.review{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.rv{border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.rv b{font-size:22px;font-variant-numeric:tabular-nums;color:var(--bad)}
.rv span{font-size:13px;color:var(--muted)}
.rv[disabled]{cursor:default;opacity:.6}
.rv[disabled] b{color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:10px}
.cat{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.cat b{font-size:15px}
.cat span{font-size:12px;color:var(--muted)}
.cat.on{border-color:var(--accent)}
.cat.on span{color:var(--accent)}
.cat.soon{background:var(--sunk);cursor:default}
details.plan summary{cursor:pointer;font-size:14px;color:var(--accent);font-weight:500}
.plantbl{overflow-x:auto;margin-top:10px}
.plantbl table{border-collapse:collapse;width:100%;font-size:13px}
.plantbl th,.plantbl td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
.plantbl th{color:var(--muted);font-weight:500;white-space:nowrap}
.plantbl tr.now td{background:var(--accent-soft)}
.plantbl td.zhs{font-family:var(--font-han)}

/* vocab */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.w{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 12px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;cursor:pointer;min-width:0;user-select:none;-webkit-user-select:none}
.w .h{font-family:var(--font-han);font-size:30px;line-height:1.2;font-weight:500;letter-spacing:.02em}
.w .p{color:var(--accent);font-size:14px;font-weight:500}
.w .m{font-size:14px;overflow-wrap:anywhere}
.hideP .w:not(.peek) .p,.hideM .w:not(.peek) .m{color:transparent;background:var(--line);border-radius:4px}
.dot{position:absolute;top:8px;left:8px;width:7px;height:7px;border-radius:50%;background:transparent}
.w[data-st="k"] .dot,.legend .k{background:var(--accent)}
.w[data-st="u"] .dot,.legend .u{background:var(--bad)}
.say{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.say:active{background:var(--accent-soft);color:var(--accent)}

/* grammar */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:12px;align-items:start}
.g{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;scroll-margin-top:150px}
.g.flash{border-color:var(--accent)}
.gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gh h3{margin:0;font-family:var(--font-han);font-size:24px;font-weight:700;line-height:1.2}
.gh .sub{font-size:14px;color:var(--muted);font-weight:500}
.gh .pill{margin-left:auto}
.formula{background:var(--sunk);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.fl{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:14px}
.fl .plus{color:var(--muted);font-size:12px}
.fl .tk.zhk{font-family:var(--font-han);color:var(--accent);font-weight:700;font-size:16px}
.desc{margin:0;font-size:14.5px}
.ex{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ex li{display:flex;flex-direction:column;gap:1px}
.ex .s{font-family:var(--font-han);font-size:19px;line-height:1.45}
.ex mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.ex .py{color:var(--accent);font-size:13px}
.ex .ko{color:var(--muted);font-size:13.5px}
.noPy .ex .py,.noKo .ex .ko{display:none}
.mis{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.mis .mr{display:flex;gap:8px;align-items:baseline}
.mis .mr b{flex:none;width:16px;text-align:center}
.mis .wr b,.mis .wr .s{color:var(--bad)}
.mis .wr .s{text-decoration:line-through;text-decoration-thickness:1px}
.mis .ok b{color:var(--accent)}
.mis .s{font-family:var(--font-han);font-size:16px}
.mis p{margin:2px 0 0 24px;color:var(--muted);font-size:13px}

/* check (shared) */
.check{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.opts{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.opt>span{font-size:13px;color:var(--muted);font-weight:500}
.prog{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.track{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:-8px}
.track i{display:block;height:100%;background:var(--accent);transition:width .2s}
.fc{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:36px 20px 28px;text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none}
.q.han{font-family:var(--font-han);font-size:clamp(56px,16vw,88px);line-height:1.1;font-weight:500}
.q.mean{font-size:26px;font-weight:600;line-height:1.35;text-wrap:balance}
.a{display:flex;flex-direction:column;gap:4px;align-items:center}
.a.ph{color:var(--muted);font-size:14px}
.ap{color:var(--accent);font-size:20px;font-weight:500}
.am{font-size:20px;text-wrap:balance}
.ah{font-family:var(--font-han);font-size:52px;line-height:1.15}
.qc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 18px;display:flex;flex-direction:column;gap:16px}
.qc .tag{font-size:12px;color:var(--muted)}
.stem{font-size:22px;line-height:1.5;margin:0;text-wrap:balance}
.zhs{font-family:var(--font-han)}
.blank{display:inline-block;min-width:2.4em;border-bottom:2px solid var(--ink);text-align:center;font-family:var(--font-han);margin:0 2px}
.blank.fill{color:var(--accent);border-color:var(--accent)}
.choices{display:flex;flex-direction:column;gap:8px}
.ch{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:52px}
.ch .n{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--muted);font-size:12px;font-weight:600}
.ch .t{font-family:var(--font-han);font-size:18px}
.ch.ok{border-color:var(--accent);background:var(--accent-soft)}
.ch.ok .n{background:var(--accent);color:var(--accent-ink)}
.ch.no{border-color:var(--bad);background:var(--bad-soft)}
.ch.no .n{background:var(--bad);color:var(--surface)}
.ch[disabled]{cursor:default}
.expl{background:var(--sunk);border-radius:10px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.expl b.k{color:var(--accent)} .expl b.u{color:var(--bad)}
.lnk{border:0;background:none;color:var(--accent);font-size:13px;cursor:pointer;padding:0;text-decoration:underline;align-self:flex-start}
.acts{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px}
.btn{height:54px;border-radius:14px;border:1px solid transparent;font-size:16px;font-weight:600;cursor:pointer;width:100%}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.good{background:var(--accent);color:var(--accent-ink)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.keys{color:var(--muted);font-size:12px;text-align:center}
.done{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 20px;display:flex;flex-direction:column;gap:14px}
.done h2{margin:0;font-size:20px}
.score{margin:0;font-size:16px}
.score b{font-size:24px;font-variant-numeric:tabular-nums}
.score .sk{color:var(--accent)} .score .su{color:var(--bad)}
.vmiss{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.vmiss div{display:flex;gap:10px;align-items:baseline;padding-block:8px;border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.vmiss b{font-family:var(--font-han);font-size:20px;font-weight:500}
.vmiss span{color:var(--accent)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:28px 20px;text-align:center;color:var(--muted)}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}
.link{border:0;background:none;color:var(--bad);font-size:12px;cursor:pointer;padding:0;text-decoration:underline}
/* sentence ordering */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:10px}
.sc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-width:0;user-select:none;-webkit-user-select:none}
.sc .tiles{display:flex;flex-wrap:wrap;gap:6px}
.sc .tiles span{font-family:var(--font-han);font-size:15px;border:1px solid var(--line);border-radius:8px;padding:2px 8px;background:var(--sunk)}
.sc .ans{font-family:var(--font-han);font-size:19px;line-height:1.4;align-self:flex-start}
.sc .ko{font-size:13.5px;color:var(--muted)}
.hideA .sc:not(.peek) .ans{color:transparent;background:var(--line);border-radius:4px}
.sc .meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hintko{margin:0;font-size:17px;font-weight:500;text-wrap:balance}
.slots{min-height:66px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.slots .ph{color:var(--muted);font-size:13px;padding:0 6px}
.slots.ok{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.slots.no{border-style:solid;border-color:var(--bad);background:var(--bad-soft)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{font-family:var(--font-han);font-size:19px;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:8px 13px;min-height:46px;cursor:pointer}
.tile.in{background:var(--surface);border-color:var(--accent)}
.tile.used{visibility:hidden}
.tile[disabled]{cursor:default}
.pn{font-family:var(--font-han);font-size:20px}
.expl .zhs{font-size:17px}
.expl .mine{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:default}
#views{flex:0 1 auto;overflow-x:auto;min-width:0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#views::-webkit-scrollbar{display:none}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.mw{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0;scroll-margin-top:150px}
.mw.flash{border-color:var(--accent)}
.mh{display:flex;align-items:baseline;gap:8px}
.mh .h{font-family:var(--font-han);font-size:34px;font-weight:700;line-height:1.1}
.mh .p{color:var(--accent);font-size:15px;font-weight:500}
.mh .pill{margin-left:auto}
.mw .d{font-size:14px}
.mw .mex{font-family:var(--font-han);font-size:17px;color:var(--muted)}
.cp{color:var(--accent);font-size:14px;margin-top:-6px}
.tipline{color:var(--muted);font-size:13.5px;border-top:1px dashed var(--line);padding-top:10px}
.xlist{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px}

/* ---------- data prep ---------- */
const TOPICS = [];
RAW.trim().split('\n').forEach(line => {
  line = line.trim();
  if (!line) return;
  if (line[0] === '#') { TOPICS.push({ name: line.slice(1), words: [] }); return; }
  const [h, p, m] = line.split('|');
  const t = TOPICS.length - 1;
  TOPICS[t].words.push({ h, p, m, t, key: t + ':' + h });
});
const ALL = TOPICS.flatMap(t => t.words);
const byId = Object.fromEntries(CARDS.map(c => [c.id, c]));
const QTOTAL = CARDS.reduce((n, c) => n + c.q.length, 0);
const SENTS = SENT_RAW.trim().split('\n').map((line, i) => {
  const [gid, ch, p, ko, alt] = line.trim().split('|');
  const chunks = ch.split('/');
  return { id: 's' + i, gid, g: byId[gid].g, chunks, p, ko, ans: chunks.join(''), ok: [chunks.join('')].concat(alt ? alt.split(';') : []) };
});
const SGROUPS = GROUPS.map((_, i) => i).filter(i => SENTS.some(s => s.g === i));

/* 14주 플랜: 1~8주 새 단어, 1~10주 문법 3개씩, 11~14주 실전 복습 */
const WEEKS = 14;
const PLAN = Array.from({ length: WEEKS }, () => ({ vt: [], gc: [] }));
(function () {
  const per = ALL.length / 8; let cum = 0;
  TOPICS.forEach((t, i) => { const wk = Math.min(7, Math.floor((cum + t.words.length / 2) / per)); PLAN[wk].vt.push(i); cum += t.words.length; });
  CARDS.forEach((c, i) => PLAN[Math.floor(i / 3)].gc.push(c.id));
})();
const phaseOf = w => w < 8 ? '1~8주 · 새 단어 + 문법' : w < 10 ? '9~10주 · 문법 마무리 + 단어 복습' : '11~14주 · 실전 복습';

/* ---------- storage ---------- */
const KEY = 'hsk3-app-v1';
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function load() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  s = s || {};
  return {
    start: s.start || todayStr(),
    marks: s.marks || {},
    res: s.res || {},
    sres: s.sres || {},
    s: Object.assign({ mode: 'check', grp: 'all', hideA: true, hint: true, scope: 'all', shuffle: true }, s.s),
    mc: Object.assign({ m: {}, c: {}, x: {} }, s.mc),
    m: Object.assign({ mode: 'study', grp: 'all', scope: 'all', shuffle: true }, s.m),
    c: Object.assign({ mode: 'study', grp: 'all', scope: 'all', shuffle: true }, s.c),
    x: Object.assign({ mode: 'study', grp: 'all', hideP: false, hideM: false, scope: 'all', shuffle: true }, s.x),
    v: Object.assign({ mode: 'study', topic: 0, hideP: false, hideM: false, dir: 'h2m', scope: 'all', shuffle: true }, s.v),
    g: Object.assign({ mode: 'study', grp: 'all', noPy: false, noKo: false, scope: 'all', shuffle: true }, s.g)
  };
}
let S = load();
if (S.v.topic !== 'all' && !TOPICS[S.v.topic]) S.v.topic = 0;
if (S.g.grp !== 'all' && !GROUPS[S.g.grp]) S.g.grp = 'all';
if (S.s.grp !== 'all' && !SGROUPS.includes(S.s.grp)) S.s.grp = 'all';
['m', 'c', 'x'].forEach(k => { if (S[k].grp !== 'all' && typeof S[k].grp !== 'number') S[k].grp = 'all'; });
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
save();

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const main = $('#main'), rail = $('#rail');
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const hasHan = s => /[一-鿿]/.test(s);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const knownCount = ws => ws.filter(w => S.marks[w.key] === 'k').length;
const unknownWords = () => ALL.filter(w => S.marks[w.key] === 'u');
const cardsOf = g => g === 'all' ? CARDS : CARDS.filter(c => c.g === g);
const qids = c => c.q.map((_, i) => c.id + '-' + i);
const rightCount = cs => cs.flatMap(qids).filter(id => S.res[id] === 'k').length;
const wrongCount = () => Object.values(S.res).filter(v => v === 'u').length;
const sentsOf = g => g === 'all' ? SENTS : SENTS.filter(s => s.g === g);
const sRight = () => SENTS.filter(s => S.sres[s.id] === 'k').length;
const sWrong = () => SENTS.filter(s => S.sres[s.id] === 'u').length;
const canSpeak = 'speechSynthesis' in window;
function speak(text) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'zh-CN'; u.rate = 0.8; speechSynthesis.speak(u); } catch (e) {} }
const SPK = '<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>';
function segBtn(sec, k, v, label) {
  const cur = k === 'shuffle' ? (S[sec].shuffle ? '1' : '0') : S[sec][k];
  return `<button data-opt="${k}" data-val="${v}" aria-pressed="${String(cur) === String(v)}">${label}</button>`;
}
function weekIndex() {
  const days = Math.floor((new Date(todayStr() + 'T00:00') - new Date(S.start + 'T00:00')) / 86400000);
  return Math.floor(days / 7);
}

/* ---------- routing ---------- */
const VIEWS = ['home', 'vocab', 'grammar', 'sentence', 'measure', 'conj', 'situ'];
const secOf = v => ({ vocab: 'v', grammar: 'g', sentence: 's', measure: 'm', conj: 'c', situ: 'x' })[v] || 's';
let view = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'home';
function go(v, after) {
  view = v; resetArmed = false;
  try { if (location.hash.slice(1) !== v) history.replaceState(null, '', '#' + v); } catch (e) {}
  render();
  if (after) after(); else window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (VIEWS.includes(h) && h !== view) { view = h; render(); window.scrollTo(0, 0); } });

/* ---------- header ---------- */
function renderTop() {
  document.querySelectorAll('#views button').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === view));
  $('#subbar').hidden = view === 'home';
  if (view === 'home') return;
  const sec = S[secOf(view)];
  document.querySelectorAll('#modes button').forEach(b => {
    b.setAttribute('aria-pressed', b.dataset.mode === sec.mode);
    b.textContent = b.dataset.mode === 'study' ? (view === 'sentence' ? '정답 보기' : '공부') : (view === 'sentence' ? '연습' : '확인');
  });
  if (MCSEC.includes(secOf(view))) {
    const sec = secOf(view);
    const chip = (v, name, qs) => `<button class="chip" data-xgrp="${v}" aria-pressed="${String(S[sec].grp) === String(v)}">${name}<small>${qs.filter(q => S.mc[sec][q.qid] === 'k').length}/${qs.length}</small></button>`;
    rail.innerHTML = chip('all', '전체', MCALL[sec]) + MC_GROUPS[sec].map((g, i) => chip(i, g, MCALL[sec].filter(q => q.g === i))).join('');
  } else if (view === 'sentence') {
    const chip = (v, name, ss) => `<button class="chip" data-sgrp="${v}" aria-pressed="${String(S.s.grp) === String(v)}">${name}<small>${ss.filter(s => S.sres[s.id] === 'k').length}/${ss.length}</small></button>`;
    rail.innerHTML = chip('all', '전체', SENTS) + SGROUPS.map(i => chip(i, GROUPS[i], sentsOf(i))).join('');
  } else if (view === 'vocab') {
    const chip = (v, name, ws) => `<button class="chip" data-topic="${v}" aria-pressed="${String(S.v.topic) === String(v)}">${name}<small>${knownCount(ws)}/${ws.length}</small></button>`;
    rail.innerHTML = chip('all', '전체', ALL) + TOPICS.map((t, i) => chip(i, t.name, t.words)).join('');
  } else {
    const chip = (v, name, cs) => `<button class="chip" data-grp="${v}" aria-pressed="${String(S.g.grp) === String(v)}">${name}<small>${cs.length}</small></button>`;
    rail.innerHTML = chip('all', '전체', CARDS) + GROUPS.map((g, i) => chip(i, g, cardsOf(i))).join('');
  }
}

/* ---------- home ---------- */
function gPill(c) {
  const ids = qids(c), done = ids.filter(id => S.res[id]);
  if (!done.length) return '<span class="pill">안 풀었음</span>';
  const ok = ids.filter(id => S.res[id] === 'k').length;
  const cls = ok === ids.length ? 'k' : (ids.some(id => S.res[id] === 'u') ? 'u' : '');
  return `<span class="pill ${cls}">${ok}/${ids.length}</span>`;
}
function renderHome() {
  const wi = weekIndex();
  const known = knownCount(ALL), right = rightCount(CARDS);
  const uw = unknownWords().length, wq = wrongCount(), sr = sRight(), sw = sWrong();
  let weekTitle, todo;
  if (wi < 0) {
    weekTitle = `<div class="weekno">시작 전</div><div class="phase">시작일이 아직 안 됐어요</div>`;
    todo = '<p class="hint">시작일을 오늘로 바꾸면 1주차 할 일이 보여요.</p>';
  } else if (wi >= WEEKS) {
    weekTitle = `<div class="weekno">플랜 완료</div><div class="phase">14주를 모두 지났어요. 시험 접수해 볼까요?</div>`;
    todo = reviewTodo();
  } else {
    const P = PLAN[wi];
    weekTitle = `<div class="weekno">${wi + 1}주차<small>/ ${WEEKS}주</small></div><div class="phase">${phaseOf(wi)}</div>`;
    let t = '';
    if (P.vt.length) t += '<div class="sub">단어</div>' + P.vt.map(i => `<button class="row" data-go-topic="${i}"><span class="nm"><span>${TOPICS[i].name}</span></span><span class="rt">${knownCount(TOPICS[i].words)}/${TOPICS[i].words.length} 외움<span class="go">›</span></span></button>`).join('');
    else if (wi < 10) t += `<div class="sub">단어</div><button class="row" data-review="v"><span class="nm"><span>몰라요 단어 복습</span></span><span class="rt">${uw}개<span class="go">›</span></span></button>`;
    if (P.gc.length) t += '<div class="sub">문법</div>' + P.gc.map(id => `<button class="row" data-go-card="${id}"><span class="nm"><span class="zhs">${esc(byId[id].t)}</span><span>${esc(byId[id].s)}</span></span><span class="rt">${gPill(byId[id])}<span class="go">›</span></span></button>`).join('');
    const ws = SENTS.filter(s => P.gc.includes(s.gid));
    if (ws.length) t += `<div class="sub">문장 배열</div><button class="row" data-sweek="${wi}"><span class="nm"><span>이번 주 문법으로 배열 연습</span></span><span class="rt">${ws.filter(s => S.sres[s.id] === 'k').length}/${ws.length} 맞힘<span class="go">›</span></span></button>`;
    const extraRow = (v, name, n) => `<button class="row" data-view="${v}"><span class="nm"><span>${name}</span></span><span class="rt">${n}<span class="go">›</span></span></button>`;
    if (wi === 8) t += '<div class="sub">양사</div>' + extraRow('measure', '양사 카드 공부하고 확인하기', `${mcRight('m')}/${MCALL.m.length} 맞힘`);
    if (wi === 9) t += '<div class="sub">접속사</div>' + extraRow('conj', '접속사 카드 공부하고 확인하기', `${mcRight('c')}/${MCALL.c.length} 맞힘`);
    if (wi === 10 || wi === 11) t += '<div class="sub">상황별 표현</div>' + extraRow('situ', '상황별 표현 듣고 따라 하기', `${mcRight('x')}/${MCALL.x.length} 맞힘`);
    if (!P.vt.length && !P.gc.length && wi >= 10) t += reviewTodo();
    todo = t;

function sCheck() {
  const it = sdeck.items[sdeck.i];

  const ok = it.s.ok.includes(it.placed.map(i => it.s.chunks[i]).join(''));

  if (!done.length) return '<span class="pill">안 풀었음</span>';
  const ok = ids.filter(id => S.mc[sec][id] === 'k').length;
  const cls = ok === ids.length ? 'k' : (ids.some(id => S.mc[sec][id] === 'u') ? 'u' : '');
  return `<span class="pill ${cls}">${ok}/${ids.length}</span>`;
}
const listOf = sec => S[sec].grp === 'all' ? MC_GROUPS[sec].map((_, i) => i) : [S[sec].grp];

function renderMeasureStudy() {
  main.innerHTML = `<div class="tools"><span class="hint">숫자 + 양사 + 명사 순서예요. 예: 两 + 本 + 书</span></div>` +
    listOf('m').map(g => {
      const its = MEASURES.filter(m => m.g === g);
      return `<section class="grp"><h2>${MGROUPS[g]}<small>${its.length}개</small></h2><div class="mgrid">${its.map(m => `
        <article class="mw" id="m-${m.id}">
          <div class="mh"><span class="h">${m.h}</span><span class="p">${m.p}</span>${mcPill('m', m.q.map((_, i) => m.id + '-' + i))}</div>
          <div class="d">${esc(m.d)}</div>
          <div class="mex">${esc(m.ex)}</div>
        </article>`).join('')}</div></section>`;
    }).join('');
}
function renderConjStudy() {
  main.innerHTML = `<div class="tools"><span class="hint">노란 표시가 접속사예요. 짝을 이루는 말을 같이 외우세요.</span></div>` +
    listOf('c').map(g => {
      const its = CONJS.filter(c => c.g === g);
      return `<section class="grp"><h2>${CGROUPS[g]}<small>${its.length}개</small></h2><div class="cards">${its.map(c => {
        const keys = c.t.split(/[…\/ ]+/).filter(Boolean);
        return `<article class="g" id="c-${c.id}">
          <div class="gh"><h3>${esc(c.t)}</h3><span class="sub">${esc(c.m)}</span>${mcPill('c', c.q.map((_, i) => c.id + '-' + i))}</div>
          <div class="cp">${esc(c.p)}</div>
          <div class="formula">${formulaHTML(c.f)}</div>
          <ul class="ex">${c.ex.map(e => `<li><span class="s">${highlight(e[0], keys)}</span><span class="py">${esc(e[1])}</span><span class="ko">${esc(e[2])}</span></li>`).join('')}</ul>
          <p class="desc tipline">${esc(c.tip)}</p>
        </article>`;
      }).join('')}</div></section>`;
    }).join('');
}
function renderSituStudy() {
  const X = S.x;
  main.innerHTML = `<div class="tools">
      <button class="tog" data-tog="hideP" aria-pressed="${X.hideP}">병음 가리기</button>
      <button class="tog" data-tog="hideM" aria-pressed="${X.hideM}">뜻 가리기</button>
      <span class="hint">${X.hideP || X.hideM ? '문장을 누르면 가린 부분이 보여요' : (canSpeak ? '스피커 버튼을 누르면 발음이 나와요' : '')}</span>
    </div>
    <div class="${X.hideP ? 'hideXP ' : ''}${X.hideM ? 'hideXM' : ''}">` +
    listOf('x').map(g => `<section class="grp"><h2>${SITUS[g].name}<small>${SITUS[g].items.length}개</small></h2><div class="xlist">${SITUS[g].items.map((e, i) => `
      <div class="xrow" role="button" tabindex="0" data-st="${S.mc.x['x' + g + '-' + i] || ''}">
        <i class="dot"></i>
        <div class="xt"><span class="xz">${esc(e[0])}</span><span class="xp">${esc(e[1])}</span><span class="xk">${esc(e[2])}</span></div>
        ${canSpeak ? `<button class="say" data-say="${esc(e[0])}" aria-label="발음 듣기">${SPK}</button>` : ''}
      </div>`).join('')}</div></section>`).join('') + `</div>`;
}

function buildMDeck(sec, items) {
  let qs = items;
  if (!qs) {
    const P = S[sec];
    qs = MCALL[sec].filter(q => P.grp === 'all' || q.g === P.grp);
    if (P.scope === 'u') qs = qs.filter(q => S.mc[sec][q.qid] === 'u');
    if (P.scope === 'n') qs = qs.filter(q => !S.mc[sec][q.qid]);
  }
  qs = qs.map(q => {
    let opts = q.opts;
    if (sec === 'x') {
      const pool = SITUS[q.g].items.map(e => e[0]).filter(z => z !== q.zh);
      opts = [q.zh].concat(shuffle(pool.slice()).slice(0, 2));
    }
    return Object.assign({}, q, { opts, order: shuffle([0, 1, 2]) });
  });
  if (S[sec].shuffle) shuffle(qs);
  mdeck[sec] = { items: qs, i: 0, picked: null, right: 0, wrong: [] };
}
function renderMCCheck(sec) {
  if (!mdeck[sec]) buildMDeck(sec);
  const D = mdeck[sec], n = D.items.length, P = S[sec];
  let body;
  if (!n) {
    body = `<div class="empty">${P.scope === 'u' ? '여기서 틀린 문제가 없어요.<br>범위를 ‘전체’로 바꿔서 시작해 보세요.' : '이 분류의 문제를 모두 한 번씩 풀었어요.<br>범위를 ‘전체’나 ‘틀린 것만’으로 바꿔 보세요.'}</div>`;
  } else if (D.i >= n) {
    const w = D.wrong;
    let list = '';
    if (w.length && sec === 'x') list = `<div class="vmiss">${w.map(q => `<div><b>${esc(q.zh)}</b><span>${esc(q.py)}</span>${esc(q.stem)}</div>`).join('')}</div>`;
    else if (w.length) {
      const refs = [...new Set(w.map(q => q.ref))];
      list = `<p class="hint">틀린 카드를 다시 읽어 보세요.</p><div class="todo">${refs.map(r => { const q = w.find(x => x.ref === r); return `<button class="row" data-goref="${sec}:${r}"><span class="nm"><span class="zhs">${esc(q.refLabel)}</span></span><span class="rt">카드 보기<span class="go">›</span></span></button>`; }).join('')}</div>`;
    }
    body = `<div class="done"><h2>다 풀었어요!</h2>
      <p class="score"><b class="sk">${D.right}</b> 맞힘 &nbsp;·&nbsp; <b class="su">${w.length}</b> 틀림</p>
      ${w.length ? list : '<p class="hint">전부 맞혔어요. 다른 분류도 풀어 보세요.</p>'}
      <div class="acts">${w.length ? `<button class="btn bad" data-act="mretry">틀린 ${w.length}문제 다시</button>` : ''}<button class="btn primary" data-act="mrestart">처음부터 다시</button></div></div>`;
  } else {
    const q = D.items[D.i], answered = D.picked !== null, ok = D.picked === 0;
    const isBlank = q.stem.includes('（ ）');
    const tag = sec === 'x' ? `${SITUS[q.g].name} · 이 말을 중국어로 하면?` : (isBlank ? '빈칸에 알맞은 것을 고르세요' : '알맞은 것을 고르세요');
    const stem = sec === 'x' ? `<p class="stem">${esc(q.stem)}</p>` : `<p class="stem">${stemHTML(q.stem, answered && isBlank ? q.opts[0] : null)}</p>`;
    const extra = sec === 'x'
      ? `<div><span class="zhs">${esc(q.zh)}</span> ${canSpeak ? `<button class="lnk" data-say="${esc(q.zh)}">발음 듣기</button>` : ''}</div><div class="hint">${esc(q.py)}</div>`
      : `<button class="lnk" data-goref="${sec}:${q.ref}">${esc(q.refLabel)} 카드 보기</button>`;
    body = `<div class="prog"><span>${MC_NAME[sec]} · ${MC_GROUPS[sec][q.g]}</span><span class="num">${D.i + 1} / ${n}</span></div>
      <div class="track"><i style="width:${D.i / n * 100}%"></i></div>
      <div class="qc">
        <span class="tag">${tag}</span>
        ${stem}
        <div class="choices">${q.order.map((oi, idx) => {
          const cls = answered && oi === 0 ? ' ok' : answered && oi === D.picked ? ' no' : '';
          return `<button class="ch${cls}" data-mpick="${oi}" ${answered ? 'disabled' : ''}><span class="n">${idx + 1}</span><span class="t">${esc(q.opts[oi])}</span></button>`;
        }).join('')}</div>
        ${answered ? `<div class="expl"><div>${ok ? '<b class="k">정답!</b>' : '<b class="u">아쉬워요.</b>'} ${sec === 'x' ? '' : esc(q.expl)}</div>${extra}</div>` : ''}
      </div>
      ${answered ? '<button class="btn primary" data-act="mnext">다음 문제</button>' : ''}
      <div class="keys">키보드: 1 · 2 · 3 = 고르기 · Enter = 다음</div>`;
  }
  main.innerHTML = `<div class="check">
    <div class="opts">
      <div class="opt"><span>범위</span><div class="seg sm">${segBtn(sec, 'scope', 'all', '전체')}${segBtn(sec, 'scope', 'u', '틀린 것만')}${segBtn(sec, 'scope', 'n', '안 푼 것')}</div></div>
      <div class="opt"><span>순서</span><div class="seg sm">${segBtn(sec, 'shuffle', '1', '섞기')}${segBtn(sec, 'shuffle', '0', '차례대로')}</div></div>
    </div>
    ${body}
    <div class="foot"><span>기록은 이 기기, 이 브라우저에만 저장돼요.</span><button class="link" data-act="mreset">${resetArmed ? `한 번 더 누르면 ${MC_NAME[sec]} 기록이 모두 지워져요` : `${MC_NAME[sec]} 기록 지우기`}</button></div>
  </div>`;
}
function mPick(sec, oi) {
  const D = mdeck[sec];
  if (!D || D.i >= D.items.length || D.picked !== null) return;
  const q = D.items[D.i];
  D.picked = oi;
  if (oi === 0) { D.right++; S.mc[sec][q.qid] = 'k'; } else { D.wrong.push(q); S.mc[sec][q.qid] = 'u'; }
  save(); renderTop(); renderMCCheck(sec);
}
function mNext(sec) { const D = mdeck[sec]; if (D && D.picked !== null) { D.i++; D.picked = null; renderMCCheck(sec); window.scrollTo(0, 0); } }
function goRef(sec, id) {
  S[sec].mode = 'study'; S[sec].grp = 'all'; save();
  go(SEC_VIEW[sec], () => {
    const el = document.getElementById(sec + '-' + id);
    if (el) { el.scrollIntoView({ block: 'start' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1600); }
  });
}
function openMC(sec, scope) {
  S[sec].grp = 'all'; S[sec].mode = 'check'; S[sec].scope = scope; mdeck[sec] = null; save(); go(SEC_VIEW[sec]);
}
/* 양사·접속사·표현 전용 클릭 처리. 처리했으면 true */
function handleMC(e, sec) {
  const at = s => e.target.closest(s); let el;
  if ((el = at('[data-tog]'))) { S[sec][el.dataset.tog] = !S[sec][el.dataset.tog]; save(); render(); return true; }
  if ((el = at('.xrow'))) { el.classList.toggle('peek'); return true; }
  if ((el = at('[data-opt]'))) {
    const k = el.dataset.opt, v = el.dataset.val;
    S[sec][k] = k === 'shuffle' ? v === '1' : v; mdeck[sec] = null; save(); render(); return true;
  }
  if ((el = at('[data-mpick]'))) { mPick(sec, +el.dataset.mpick); return true; }
  if ((el = at('[data-act]'))) {
    const a = el.dataset.act;
    if (a === 'mnext') mNext(sec);
    else if (a === 'mretry') { buildMDeck(sec, mdeck[sec].wrong); render(); window.scrollTo(0, 0); }
    else if (a === 'mrestart') { mdeck[sec] = null; render(); window.scrollTo(0, 0); }
    else if (a === 'mreset') {
      if (!resetArmed) { resetArmed = true; render(); return true; }
      S.mc[sec] = {}; mdeck[sec] = null; resetArmed = false; save(); render();
    }
    return true;
  }
  return false;
}
document.addEventListener('keydown', e => {
  const sec = secOf(view);
  if (!MCSEC.includes(sec) || S[sec].mode !== 'check') return;
  const D = mdeck[sec]; if (!D || D.i >= D.items.length) return;
  if (['1', '2', '3'].includes(e.key) && D.picked === null) mPick(sec, D.items[D.i].order[+e.key - 1]);
  else if (e.key === 'Enter' && D.picked !== null) { e.preventDefault(); mNext(sec); }
});

/* ---------- render ---------- */
function render() {
  renderTop();
  if (view === 'home') renderHome();
  else if (view === 'vocab') S.v.mode === 'study' ? renderVocabStudy() : renderVocabCheck();
  else if (view === 'grammar') S.g.mode === 'study' ? renderGrammarStudy() : renderGrammarCheck();
  else if (view === 'sentence') S.s.mode === 'study' ? renderSentStudy() : renderSentCheck();
  else if (view === 'measure') S.m.mode === 'study' ? renderMeasureStudy() : renderMCCheck('m');
  else if (view === 'conj') S.c.mode === 'study' ? renderConjStudy() : renderMCCheck('c');
  else S.x.mode === 'study' ? renderSituStudy() : renderMCCheck('x');
}
function openCard(id) {
  S.g.mode = 'study'; S.g.grp = 'all'; save();
  go('grammar', () => {
    const el = document.getElementById('g-' + id);
    if (el) { el.scrollIntoView({ block: 'start' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1600); }
  });
}

/* ---------- events ---------- */
document.querySelector('header.top').addEventListener('click', e => {
  const vb = e.target.closest('[data-view]');
  if (vb) { go(vb.dataset.view); return; }
  const mb = e.target.closest('[data-mode]');
  if (mb) { S[secOf(view)].mode = mb.dataset.mode; resetArmed = false; save(); render(); window.scrollTo(0, 0); return; }
  const xb = e.target.closest('[data-xgrp]');
  if (xb) { const sec = secOf(view); S[sec].grp = xb.dataset.xgrp === 'all' ? 'all' : +xb.dataset.xgrp; mdeck[sec] = null; save(); render(); window.scrollTo(0, 0); return; }
  const sb = e.target.closest('[data-sgrp]');
  if (sb) { S.s.grp = sb.dataset.sgrp === 'all' ? 'all' : +sb.dataset.sgrp; sdeck = null; save(); render(); window.scrollTo(0, 0); return; }
  const tb = e.target.closest('[data-topic]');
  if (tb) { S.v.topic = tb.dataset.topic === 'all' ? 'all' : +tb.dataset.topic; vdeck = null; save(); render(); window.scrollTo(0, 0); return; }
  const gb = e.target.closest('[data-grp]');
  if (gb) { S.g.grp = gb.dataset.grp === 'all' ? 'all' : +gb.dataset.grp; gdeck = null; save(); render(); window.scrollTo(0, 0); }
});
main.addEventListener('change', e => {
  if (e.target.id === 'start' && e.target.value) { S.start = e.target.value; save(); renderHome(); }
});
main.addEventListener('click', e => {
  const t = e.target, at = s => t.closest(s);
  let el;
  if ((el = at('[data-view]'))) { go(el.dataset.view); return; }
  if ((el = at('[data-goref]'))) { const [sc, id] = el.dataset.goref.split(':'); goRef(sc, id); return; }
  if ((el = at('[data-mopen]'))) { const [sc, scope] = el.dataset.mopen.split(':'); openMC(sc, scope); return; }
  if ((el = at('[data-go-topic]'))) { S.v.topic = +el.dataset.goTopic; S.v.mode = 'study'; vdeck = null; save(); go('vocab'); return; }
  if ((el = at('[data-go-card]'))) { openCard(el.dataset.goCard); return; }
  if ((el = at('[data-review]'))) {
    if (el.dataset.review === 'v') { S.v.topic = 'all'; S.v.mode = 'check'; S.v.scope = 'u'; vdeck = null; save(); go('vocab'); }
    else if (el.dataset.review === 'g') { S.g.grp = 'all'; S.g.mode = 'check'; S.g.scope = 'u'; gdeck = null; save(); go('grammar'); }
    else { S.s.grp = 'all'; S.s.mode = 'check'; S.s.scope = 'u'; sdeck = null; save(); go('sentence'); }
    return;
  }
  if ((el = at('[data-full]'))) {
    if (el.dataset.full === 'v') { S.v.topic = 'all'; S.v.mode = 'check'; S.v.scope = 'all'; S.v.shuffle = true; vdeck = null; save(); go('vocab'); }
    else if (el.dataset.full === 'g') { S.g.grp = 'all'; S.g.mode = 'check'; S.g.scope = 'all'; gdeck = null; save(); go('grammar'); }
    else { S.s.grp = 'all'; S.s.mode = 'check'; S.s.scope = 'all'; sdeck = null; save(); go('sentence'); }
    return;
  }
  if ((el = at('[data-sweek]'))) {
    const P = PLAN[+el.dataset.sweek];
    S.s.grp = 'all'; S.s.mode = 'check'; save();
    buildSDeck(SENTS.filter(s => P.gc.includes(s.gid)));
    go('sentence'); return;
  }
  if ((el = at('[data-say]'))) { e.stopPropagation(); speak(el.dataset.say); return; }
  const sec = secOf(view);
  if (MCSEC.includes(sec) && handleMC(e, sec)) return;
  if ((el = at('[data-tog]'))) { S[sec][el.dataset.tog] = !S[sec][el.dataset.tog]; save(); render(); return; }
  if ((el = at('.w')) || (el = at('.sc'))) { el.classList.toggle('peek'); return; }
  if ((el = at('[data-opt]'))) {
    const k = el.dataset.opt, v = el.dataset.val;
    S[sec][k] = k === 'shuffle' ? v === '1' : k === 'hint' ? v === 'true' : v;
    if (k !== 'hint') { if (sec === 'v') vdeck = null; else if (sec === 'g') gdeck = null; else sdeck = null; }
    save(); render(); return;
  }
  if ((el = at('[data-place]'))) { const it = sdeck.items[sdeck.i]; const ci = +el.dataset.place; if (!it.placed.includes(ci)) it.placed.push(ci); renderSentCheck(); return; }
  if ((el = at('[data-unplace]'))) { sdeck.items[sdeck.i].placed.splice(+el.dataset.unplace, 1); renderSentCheck(); return; }
  if ((el = at('[data-ans]'))) { vAnswer(el.dataset.ans); return; }
  if ((el = at('[data-pick]'))) { gPick(+el.dataset.pick); return; }
  if ((el = at('[data-act]'))) {
    const a = el.dataset.act;
    if (a === 'reveal') vReveal();
    if (a === 'next') gNext();
    if (a === 'scheck') sCheck();
    if (a === 'snext') sNext();
    if (a === 'sclear') { sdeck.items[sdeck.i].placed = []; renderSentCheck(); }
    if (a === 'retry') { if (sec === 'v') buildVDeck(vdeck.unknown); else if (sec === 'g') buildGDeck(gdeck.wrong); else buildSDeck(sdeck.wrong); render(); window.scrollTo(0, 0); }
    if (a === 'restart') { if (sec === 'v') vdeck = null; else if (sec === 'g') gdeck = null; else sdeck = null; render(); window.scrollTo(0, 0); }
    if (a === 'reset') {
      if (!resetArmed) { resetArmed = true; render(); return; }
      if (sec === 'v') { S.marks = {}; vdeck = null; } else if (sec === 'g') { S.res = {}; gdeck = null; } else { S.sres = {}; sdeck = null; }
      resetArmed = false; save(); render();
    }
    return;
  }
  if (at('#fc')) vReveal();
});
document.addEventListener('keydown', e => {
  if (view === 'vocab' && S.v.mode === 'check' && vdeck && vdeck.i < vdeck.items.length) {
    if (e.key === ' ' || (e.key === 'Enter' && !(e.target.closest && e.target.closest('button')))) { e.preventDefault(); vReveal(); }
    else if (vdeck.revealed && e.key === 'ArrowLeft') vAnswer('u');
    else if (vdeck.revealed && e.key === 'ArrowRight') vAnswer('k');
  } else if (view === 'grammar' && S.g.mode === 'check' && gdeck && gdeck.i < gdeck.items.length) {
    if (['1', '2', '3'].includes(e.key) && gdeck.picked === null) gPick(gdeck.items[gdeck.i].order[+e.key - 1]);
    else if (e.key === 'Enter' && gdeck.picked !== null) { e.preventDefault(); gNext(); }
  } else if (view === 'sentence' && S.s.mode === 'check' && sdeck && sdeck.i < sdeck.items.length && e.key === 'Enter') {
    e.preventDefault(); sdeck.checked === null ? sCheck() : sNext();
  }
});

render();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
